# Genera el sitio ya compilado para el hosting propio de Mayurlin y lo deja
# como un ZIP descargable desde la propia pantalla de GitHub Actions.
#
# No toca GitHub Pages: aquel sigue compilandose con `deploy.yml` y su propia
# ruta. Aqui solo cambia `VITE_BASE`, que es donde va a vivir el sitio.
name: Preparar web para mi dominio

on:
  workflow_dispatch:
    inputs:
      ruta:
        description: 'Donde va a vivir la web. Deja / si va en la raiz del dominio (mayurlintravel.eu). Si va en una subcarpeta, escribela entre barras, por ejemplo /portfolio/'
        required: true
        default: '/'
        type: string

permissions:
  contents: read

jobs:
  paquete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # El prerenderizado abre la web en un Chromium de verdad para guardar el
      # HTML ya dibujado de cada pagina. Sin este paso no hay navegador en el
      # runner y la compilacion se para. `deploy.yml` ya lo tenia; estos dos
      # flujos no, y por eso fallaban.
      - run: npx playwright install --with-deps chromium
      - name: Compilar para la ruta indicada
        run: npm run build
        env:
          VITE_BASE: ${{ inputs.ruta }}
      - name: Comprobar que las rutas quedaron bien
        run: |
          echo "Ruta usada: ${{ inputs.ruta }}"
          grep -o 'src="[^"]*"' dist/index.html
      - name: Comprobar que el paquete esta entero
        run: |
          test -f dist/.htaccess   || { echo "FALTA .htaccess"; exit 1; }
          test -f dist/404.html    || { echo "FALTA 404.html"; exit 1; }
          test -f dist/sitemap.xml || { echo "FALTA sitemap.xml"; exit 1; }
          test -d dist/images      || { echo "FALTAN las fotos"; exit 1; }
          paginas=$(find dist -name index.html | wc -l)
          echo "Paginas prerenderizadas: $paginas"
          test "$paginas" -eq 34 || { echo "Esperaba 34 paginas, hay $paginas"; exit 1; }

      # `include-hidden-files` NO ES UN DETALLE: desde la version 4.4 esta
      # accion DEJA FUERA los archivos que empiezan por punto, y avisa en un
      # renglon que nadie lee. El unico que hay aqui es `.htaccess`, y es el
      # que hace que /media-kit, /proyectos y las nueve galerias existan en un
      # hosting Apache. Sin el, el paquete se sube entero, la portada se ve
      # bien, y cualquier enlace directo da el 404 del hosting: justo los
      # enlaces que Mayurlin manda a los hoteles.
      - uses: actions/upload-artifact@v4
        with:
          name: web-para-mi-dominio
          path: dist
          include-hidden-files: true
          retention-days: 30
