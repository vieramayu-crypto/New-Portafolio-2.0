# LA RAMA QUE LEE HOSTINGER.
#
# Hostinger SI compila: al ver un package.json ejecuta `npm install` y
# `npm run build`, y publica lo que quede en `dist`. El problema no es que
# compile, es QUE NO PUEDE compilar esta web: el prerenderizado abre las 34
# paginas en un navegador de verdad, y en un hosting compartido ese navegador
# no se puede instalar -- hacen falta permisos de administrador para sus
# librerias.
#
# ASI QUE SE LE DA COMPILADO Y SE LE DEJA "COMPILAR". La rama `hostinger`
# lleva dos cosas:
#
#   dist/           la web entera, ya hecha aqui, con las 34 paginas
#   package.json    un guion de compilacion que solo escribe una linea
#
# Hostinger hace su `npm install` (no hay una sola dependencia que instalar,
# asi que es instantaneo), llama a `npm run build`, recibe un `echo`, y
# publica `dist`. Todo lo que el espera encontrar esta ahi, y lo que de
# verdad cuesta -- compilar y prerenderizar -- ya se hizo en GitHub, que si
# tiene navegador.
#
# NO TOCA NADA MAS. `main` sigue siendo el codigo, y GitHub Pages se sigue
# compilando con `deploy.yml` y su propia ruta.
#
# POR QUE LA RAMA NO INFLA EL REPOSITORIO. Las fotos pesan 130 MB, pero son
# exactamente los mismos archivos que ya estan en `public/images`: git guarda
# por contenido, asi que no se duplican. Lo unico nuevo en cada compilacion
# son el JavaScript, el CSS y los 34 HTML, que juntos no llegan a un mega.
name: Publicar en mi dominio (Hostinger)

on:
  # Cada vez que main cambia, la rama de Hostinger se pone al dia sola.
  push:
    branches: [main]
  # Y a mano, por si hace falta rehacerla sin tocar el codigo.
  workflow_dispatch:
    inputs:
      ruta:
        description: 'Donde vive la web. Deja / si va en la raiz del dominio. Si va en una subcarpeta o subdominio con carpeta propia, escribela entre barras: /portfolio/'
        required: true
        default: '/'
        type: string

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # El prerenderizado abre la web en un Chromium de verdad para guardar el
      # HTML ya dibujado de cada pagina. Sin este paso no hay navegador en el
      # runner y la compilacion se para. `deploy.yml` ya lo tenia; estos dos
      # flujos no, y por eso fallaban.
      - run: npx playwright install --with-deps chromium

      - name: Compilar para el dominio propio
        run: npm run build
        env:
          # En un push automatico no hay `inputs`, asi que cae a la raiz, que
          # es donde va a vivir la web.
          VITE_BASE: ${{ inputs.ruta || '/' }}

      - name: Comprobar que el paquete esta entero
        run: |
          echo "Ruta usada: ${{ inputs.ruta || '/' }}"
          test -f dist/index.html  || { echo "FALTA index.html"; exit 1; }
          test -f dist/.htaccess   || { echo "FALTA .htaccess"; exit 1; }
          test -f dist/404.html    || { echo "FALTA 404.html"; exit 1; }
          test -f dist/sitemap.xml || { echo "FALTA sitemap.xml"; exit 1; }
          test -d dist/images      || { echo "FALTAN las fotos"; exit 1; }
          # LAS 34 PAGINAS SON EL MOTIVO DE TODO ESTO. Si el prerenderizado se
          # salto -- no tumba la compilacion, solo avisa --, aqui se nota y no
          # se publica nada: una web sin sus copias llega vacia a cualquier
          # buscador, y eso es peor que no publicar.
          paginas=$(find dist -name index.html | wc -l)
          echo "Paginas prerenderizadas: $paginas"
          test "$paginas" -eq 34 || { echo "Esperaba 34 paginas, hay $paginas"; exit 1; }
          echo "Como quedaron las rutas:"
          grep -o 'src="[^"]*\.js"' dist/index.html

      - name: Preparar lo que Hostinger espera encontrar
        run: |
          mkdir -p publicacion
          mv dist publicacion/dist
          # EL GUION DE COMPILACION QUE NO COMPILA NADA. Sin una sola
          # dependencia: el `npm install` de Hostinger no tiene nada que
          # descargar y termina al instante.
          cat > publicacion/package.json <<'JSON'
          {
            "name": "mayu-travel-web",
            "version": "1.0.0",
            "private": true,
            "description": "La web de Mayu Travel, ya compilada. Se genera sola desde el repositorio del codigo; no se edita a mano.",
            "scripts": {
              "build": "echo 'Nada que compilar: la web ya viene hecha desde GitHub Actions, en dist/.'"
            }
          }
          JSON
          # Y su candado, por si el hosting usa `npm ci` en vez de `npm
          # install`: sin el, `npm ci` se niega a arrancar.
          (cd publicacion && npm install --package-lock-only --silent)
          echo "Esto es lo que va a ver Hostinger:"
          ls -a publicacion

      # LA RAMA CONSERVA SU HISTORIA, Y ESO NO ES UN DETALLE.
      #
      # Antes se rehacia entera en cada vuelta: `git init`, un commit huerfano
      # y `push --force`. El razonamiento era que lo que importa es el estado
      # actual del sitio, no como se llego hasta aqui. Pero para Hostinger esa
      # rama es un repositorio del que tira con un `git pull`, y un pull no
      # puede con una rama cuya historia se ha sustituido entera: la primera
      # vez clona y funciona, y a partir de la segunda falla siempre.
      #
      # Mayurlin, tras dos publicaciones seguidas: "abro el enlace pero no
      # cambia nada, he probado con varios navegadores". Comprobado: la rama
      # tenia UN solo commit, del dia, y el `content.json` que servia su
      # dominio seguia diciendo "Un rodaje tipo" mientras el de la rama ya
      # decia "Cada propuesta es a medida". O sea GitHub publicaba bien y
      # Hostinger no podia recogerlo.
      #
      # Ahora cada publicacion es un commit normal encima del anterior, asi
      # que el pull de Hostinger avanza sin sobresaltos. El contenido sigue
      # siendo un reemplazo completo: el indice se arma desde cero con los
      # archivos nuevos, asi que lo que desaparece de `dist` desaparece de la
      # rama.
      - name: Dejarlo en la rama hostinger
        run: |
          cd publicacion
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b hostinger
          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # Si la rama ya existe, su punta pasa a ser el padre de este commit.
          # `--soft` mueve HEAD y deja el indice vacio, que es justo lo que se
          # quiere: el `git add -A` de abajo lo llena con los archivos nuevos
          # y nada mas.
          if git fetch -q --depth 1 origin hostinger 2>/dev/null; then
            git reset -q --soft FETCH_HEAD
            echo "La rama ya existia: este commit va encima del anterior."
          else
            echo "La rama no existia todavia: se crea ahora."
          fi
          git add -A
          git commit -q -m "Web compilada desde ${GITHUB_SHA::7}"
          # SIN `--force`. Si alguna vez saliera rechazado, es que ha pasado
          # algo que conviene mirar, no algo que pisar.
          git push -q origin HEAD:hostinger
          echo "Listo. Hostinger puede tirar de la rama 'hostinger'."
